<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel – Team Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="admin-body">

  <!-- Admin Navbar -->
  <nav class="admin-nav">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="admin-brand"><i class="bi bi-shield-lock me-2"></i>Admin Panel</span>
      <a href="index.html" class="btn btn-sm btn-outline-light">
        <i class="bi bi-arrow-left me-1"></i> Back to Site
      </a>
    </div>
  </nav>

  <div class="container admin-container">

    <!-- Add / Edit Form -->
    <div class="admin-form-card" data-aos="fade-up">
      <h5 class="admin-form-title" id="formTitle">
        <i class="bi bi-person-plus me-2"></i>Add New Team Member
      </h5>
      <input type="hidden" id="editId"/>
      <div class="row g-3 mt-1">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control admin-input" id="memberName" placeholder="e.g. Ayesha Khan"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Role</label>
          <select class="form-select admin-input" id="memberRole">
            <option value="">Select Role</option>
            <option>Web Developer</option>
            <option>WordPress Developer</option>
            <option>AI Engineer</option>
            <option>UI/UX Designer</option>
            <option>Backend Developer</option>
            <option>Project Manager</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Profile Image URL</label>
          <input type="text" class="form-control admin-input" id="memberImage" placeholder="https://..."/>
        </div>
        <div class="col-12">
          <label class="form-label">Short Bio</label>
          <textarea class="form-control admin-input" id="memberBio" rows="3" placeholder="Write a short bio..."></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">LinkedIn URL</label>
          <input type="text" class="form-control admin-input" id="memberLinkedin" placeholder="https://linkedin.com/in/..."/>
        </div>
        <div class="col-md-6">
          <label class="form-label">GitHub URL</label>
          <input type="text" class="form-control admin-input" id="memberGithub" placeholder="https://github.com/..."/>
        </div>
        <div class="col-12 d-flex gap-2">
          <button class="btn btn-admin-save" id="saveBtn" onclick="saveMember()">
            <i class="bi bi-check-lg me-1"></i> Save Member
          </button>
          <button class="btn btn-admin-cancel d-none" id="cancelBtn" onclick="cancelEdit()">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="adminToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body" id="toastMsg">Done!</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <!-- Team Members Table -->
    <div class="admin-table-card mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="admin-form-title mb-0"><i class="bi bi-people me-2"></i>Team Members</h5>
        <span class="badge bg-accent" id="memberCount">0 members</span>
      </div>
      <div class="table-responsive">
        <table class="table admin-table align-middle">
          <thead>
            <tr>
              <th>Photo</th>
              <th>Name</th>
              <th>Role</th>
              <th>Bio</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
